<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.VIT | System Calculators</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="game-header">
            <h1><span class="neon">D.</span><span class="pulse">VIT</span></h1>
            <p class="subtitle">SYSTEM UTILITIES SUITE</p>
        </header>

        <div class="calculator-grid">
            <!-- Split Bill Calculator -->
            <div class="calculator-card" id="split-bill-calc">
                <div class="card-header">
                    <i class="fas fa-users"></i>
                    <h2>Split Bill</h2>
                </div>
                <div class="card-body">
                    <div class="input-group">
                        <label for="total-amount">Total Amount ($)</label>
                        <input type="number" id="total-amount" class="game-input" placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label for="people-count">Number of People</label>
                        <input type="number" id="people-count" class="game-input" placeholder="1">
                    </div>
                    <div class="input-group">
                        <label for="tip-percentage">Tip Percentage (%)</label>
                        <input type="number" id="tip-percentage" class="game-input" placeholder="15">
                    </div>
                    <button id="calculate-split" class="game-button">Calculate Split</button>
                    <div class="result-display">
                        <div class="result-item">
                            <span>Each Pays:</span>
                            <span id="split-result">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Other calculators can be added similarly -->
            <div class="calculator-card" id="tip-calculator">
                <div class="card-header">
                    <i class="fas fa-coins"></i>
                    <h2>Tip Calculator</h2>
                </div>
                <div class="card-body">
                    <!-- Similar input structure -->
                </div>
            </div>
        </div>

        <div class="console-panel">
            <div class="console-header">
                <span class="led led-red"></span>
                <span class="led led-yellow"></span>
                <span class="led led-green"></span>
                <span class="console-title">SYSTEM CONSOLE</span>
            </div>
            <div class="console-body" id="console-output">
                <p>> System initialized...</p>
                <p>> Ready for calculations</p>
            </div>
        </div>
    </div>

    <script src="../public/js/script.js"></script>
</body>
</html>
